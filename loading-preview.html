<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Screen Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0f1a; font-family: 'Inter', sans-serif; color: #f1f5f9; }

    .picker {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(6,11,20,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(59,130,246,0.2);
      padding: 14px 28px;
      display: flex; gap: 10px; align-items: center;
      z-index: 9999; flex-wrap: wrap;
    }
    .picker span { font-size: 12px; color: #64748b; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-right: 6px; }
    .pick-btn {
      padding: 8px 18px; border-radius: 40px; font-size: 12px; font-weight: 600;
      border: 1.5px solid rgba(59,130,246,0.3); background: transparent;
      color: #94a3b8; cursor: pointer; transition: all 0.3s; font-family: 'Inter', sans-serif;
      letter-spacing: 0.5px;
    }
    .pick-btn:hover, .pick-btn.active {
      border-color: #3b82f6; color: #3b82f6; background: rgba(59,130,246,0.08);
    }

    .screen {
      position: fixed; inset: 0;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      background: #060b14; z-index: 100;
      padding-top: 60px;
    }
    .screen.active { display: flex; }

    /* ── OPTION 1: WORKFLOW NODES ── */
    #o1 svg { width: 340px; height: 220px; overflow: visible; }
    .node { opacity: 0; transition: opacity 0.4s, transform 0.4s; transform: scale(0.4); }
    .node.on { opacity: 1; transform: scale(1); }
    .edge { stroke-dasharray: 80; stroke-dashoffset: 80; transition: stroke-dashoffset 0.5s ease; }
    .edge.on { stroke-dashoffset: 0; }
    #o1 .label {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 32px; font-weight: 700; letter-spacing: -1px;
      background: linear-gradient(135deg, #3b82f6, #1e40af);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity: 0; margin-top: 32px;
      transition: opacity 0.6s;
    }
    #o1 .label.on { opacity: 1; }
    #o1 .sub {
      font-size: 11px; color: #475569; letter-spacing: 3px; text-transform: uppercase;
      margin-top: 8px; opacity: 0; transition: opacity 0.6s 0.3s;
    }
    #o1 .sub.on { opacity: 1; }

    /* ── OPTION 2: TYPEWRITER STAGES ── */
    #o2 .stage-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 42px; font-weight: 700;
      color: #f1f5f9; min-height: 60px; text-align: center;
    }
    #o2 .stage-bar-wrap {
      width: 280px; height: 2px; background: rgba(255,255,255,0.06);
      border-radius: 2px; margin-top: 32px; overflow: hidden;
    }
    #o2 .stage-bar {
      height: 100%; width: 0;
      background: linear-gradient(90deg, #3b82f6, #1e40af);
      border-radius: 2px; transition: width 0.4s ease;
    }
    #o2 .stage-icon { font-size: 48px; margin-bottom: 20px; min-height: 60px; }
    #o2 .cursor { animation: blink 0.7s infinite; color: #3b82f6; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ── OPTION 3: CINEMATIC ── */
    #o3 .cin-wrap { position: relative; text-align: center; }
    #o3 .monogram {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 110px; font-weight: 700; letter-spacing: -4px;
      background: linear-gradient(135deg, #3b82f6, #1e40af, #3b82f6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; line-height: 1;
      transition: all 0.8s cubic-bezier(0.16,1,0.3,1);
    }
    #o3 .full-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 52px; font-weight: 700; letter-spacing: -1px;
      color: #f1f5f9; opacity: 0; transform: translateY(20px);
      transition: all 0.8s cubic-bezier(0.16,1,0.3,1);
      position: absolute; left: 50%; transform: translateX(-50%) translateY(20px);
      white-space: nowrap; top: 20px;
    }
    #o3 .tagline {
      font-size: 11px; color: #475569; letter-spacing: 4px; text-transform: uppercase;
      margin-top: 80px; opacity: 0; transition: opacity 0.6s 0.6s;
    }
    #o3 .tagline.on { opacity: 1; }
    #o3.phase2 .monogram { opacity: 0; transform: scale(0.6); }
    #o3.phase2 .full-name { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── OPTION 4: METRIC COUNTER BURST ── */
    #o4 .metrics-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 16px; width: 300px; margin-bottom: 40px;
    }
    #o4 .metric {
      background: rgba(59,130,246,0.06);
      border: 1px solid rgba(59,130,246,0.15);
      border-radius: 16px; padding: 20px 16px; text-align: center;
      opacity: 0; transform: scale(0.8);
      transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
    }
    #o4 .metric.on { opacity: 1; transform: scale(1); }
    #o4 .metric-num {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 34px; font-weight: 700;
      background: linear-gradient(135deg, #3b82f6, #1e40af);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; line-height: 1.1;
    }
    #o4 .metric-label {
      font-size: 10px; color: #475569; text-transform: uppercase;
      letter-spacing: 1.5px; margin-top: 4px;
    }
    #o4 .collapse-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 36px; font-weight: 700;
      background: linear-gradient(135deg, #3b82f6, #1e40af);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; opacity: 0;
      transition: opacity 0.5s;
    }
    #o4 .collapse-name.on { opacity: 1; }

    /* ── OPTION 5: TERMINAL ── */
    #o5 .terminal {
      background: #0d1117; border: 1px solid rgba(59,130,246,0.2);
      border-radius: 12px; padding: 28px 32px; width: 420px; max-width: 90vw;
    }
    #o5 .term-bar {
      display: flex; gap: 7px; margin-bottom: 20px;
    }
    #o5 .dot { width: 12px; height: 12px; border-radius: 50%; }
    #o5 .dot:nth-child(1) { background: #ef4444; }
    #o5 .dot:nth-child(2) { background: #f59e0b; }
    #o5 .dot:nth-child(3) { background: #22c55e; }
    #o5 .term-line {
      font-family: 'Space Mono', 'Courier New', monospace;
      font-size: 13.5px; line-height: 2; color: #94a3b8;
      white-space: pre; min-height: 27px;
    }
    #o5 .term-line .prompt { color: #3b82f6; }
    #o5 .term-line .ok { color: #22c55e; }
    #o5 .term-line .name { color: #f1f5f9; font-weight: 600; }
    #o5 .term-cursor { display: inline-block; width: 8px; height: 14px; background: #3b82f6; animation: blink 0.7s infinite; vertical-align: middle; }
  </style>
</head>
<body>

<div class="picker">
  <span>Preview</span>
  <button class="pick-btn active" onclick="show(1)">1 · Workflow Nodes</button>
  <button class="pick-btn" onclick="show(2)">2 · Typewriter Stages</button>
  <button class="pick-btn" onclick="show(3)">3 · Cinematic Reveal</button>
  <button class="pick-btn" onclick="show(4)">4 · Metric Burst</button>
  <button class="pick-btn" onclick="show(5)">5 · Terminal</button>
</div>

<!-- OPTION 1: WORKFLOW NODES -->
<div class="screen active" id="o1">
  <svg viewBox="0 0 340 200">
    <defs>
      <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3b82f6"/>
        <stop offset="100%" stop-color="#1e40af"/>
      </linearGradient>
    </defs>
    <!-- Edges -->
    <line class="edge" id="e1" x1="60" y1="100" x2="120" y2="60" stroke="url(#g1)" stroke-width="1.5" opacity="0.5"/>
    <line class="edge" id="e2" x1="60" y1="100" x2="120" y2="140" stroke="url(#g1)" stroke-width="1.5" opacity="0.5"/>
    <line class="edge" id="e3" x1="120" y1="60" x2="200" y2="40" stroke="url(#g1)" stroke-width="1.5" opacity="0.5"/>
    <line class="edge" id="e4" x1="120" y1="60" x2="200" y2="100" stroke="url(#g1)" stroke-width="1.5" opacity="0.5"/>
    <line class="edge" id="e5" x1="120" y1="140" x2="200" y2="100" stroke="url(#g1)" stroke-width="1.5" opacity="0.5"/>
    <line class="edge" id="e6" x1="120" y1="140" x2="200" y2="160" stroke="url(#g1)" stroke-width="1.5" opacity="0.5"/>
    <line class="edge" id="e7" x1="200" y1="40" x2="280" y2="100" stroke="url(#g1)" stroke-width="1.5" opacity="0.5"/>
    <line class="edge" id="e8" x1="200" y1="100" x2="280" y2="100" stroke="url(#g1)" stroke-width="1.5" opacity="0.5"/>
    <line class="edge" id="e9" x1="200" y1="160" x2="280" y2="100" stroke="url(#g1)" stroke-width="1.5" opacity="0.5"/>
    <!-- Nodes -->
    <g class="node" id="n1"><circle cx="60" cy="100" r="18" fill="url(#g1)" opacity="0.9"/><text x="60" y="105" text-anchor="middle" font-size="11" fill="white" font-family="Space Grotesk" font-weight="700">BA</text></g>
    <g class="node" id="n2"><circle cx="120" cy="60" r="14" fill="url(#g1)" opacity="0.75"/><text x="120" y="64" text-anchor="middle" font-size="9" fill="white" font-family="Space Grotesk" font-weight="600">REQ</text></g>
    <g class="node" id="n3"><circle cx="120" cy="140" r="14" fill="url(#g1)" opacity="0.75"/><text x="120" y="144" text-anchor="middle" font-size="9" fill="white" font-family="Space Grotesk" font-weight="600">UAT</text></g>
    <g class="node" id="n4"><circle cx="200" cy="40" r="12" fill="url(#g1)" opacity="0.6"/><text x="200" y="44" text-anchor="middle" font-size="8" fill="white" font-family="Space Grotesk" font-weight="600">BRD</text></g>
    <g class="node" id="n5"><circle cx="200" cy="100" r="16" fill="url(#g1)" opacity="0.85"/><text x="200" y="104" text-anchor="middle" font-size="9" fill="white" font-family="Space Grotesk" font-weight="600">AUTO</text></g>
    <g class="node" id="n6"><circle cx="200" cy="160" r="12" fill="url(#g1)" opacity="0.6"/><text x="200" y="164" text-anchor="middle" font-size="8" fill="white" font-family="Space Grotesk" font-weight="600">QA</text></g>
    <g class="node" id="n7"><circle cx="280" cy="100" r="22" fill="url(#g1)"/><text x="280" y="97" text-anchor="middle" font-size="14" fill="white" font-family="Space Grotesk" font-weight="700">AP</text><text x="280" y="111" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.7)" font-family="Inter">READY</text></g>
  </svg>
  <div class="label" id="o1label">Akash Panwar</div>
  <div class="sub" id="o1sub">Senior Business Analyst</div>
</div>

<!-- OPTION 2: TYPEWRITER STAGES -->
<div class="screen" id="o2">
  <div class="stage-icon" id="o2icon"></div>
  <div class="stage-text" id="o2text"><span id="o2typed"></span><span class="cursor">|</span></div>
  <div class="stage-bar-wrap"><div class="stage-bar" id="o2bar"></div></div>
</div>

<!-- OPTION 3: CINEMATIC -->
<div class="screen" id="o3">
  <div class="cin-wrap">
    <div class="monogram" id="o3mono">AP</div>
    <div class="full-name" id="o3full">Akash Panwar</div>
  </div>
  <div class="tagline" id="o3tag">Senior Business Analyst &nbsp;·&nbsp; Noida, India</div>
</div>

<!-- OPTION 4: METRIC BURST -->
<div class="screen" id="o4">
  <div class="metrics-grid">
    <div class="metric" id="m1"><div class="metric-num">5+</div><div class="metric-label">Years</div></div>
    <div class="metric" id="m2"><div class="metric-num">200+</div><div class="metric-label">Workflows</div></div>
    <div class="metric" id="m3"><div class="metric-num">20+</div><div class="metric-label">Apps Built</div></div>
    <div class="metric" id="m4"><div class="metric-num">500+</div><div class="metric-label">Users</div></div>
  </div>
  <div class="collapse-name" id="o4name">Akash Panwar</div>
</div>

<!-- OPTION 5: TERMINAL -->
<div class="screen" id="o5">
  <div class="terminal">
    <div class="term-bar">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <div class="term-line"><span class="prompt">$</span> <span id="t1"></span></div>
    <div class="term-line"><span class="prompt">›</span> <span id="t2"></span></div>
    <div class="term-line"><span class="prompt">›</span> <span id="t3"></span></div>
    <div class="term-line"><span class="prompt">›</span> <span id="t4"></span></div>
    <div class="term-line" id="t5ready" style="opacity:0;transition:opacity 0.5s;margin-top:8px;"></div>
  </div>
</div>

<script>
  var current = 1;
  var timers = [];

  function clearTimers() {
    timers.forEach(clearTimeout);
    timers = [];
  }

  function t(fn, delay) { timers.push(setTimeout(fn, delay)); }

  function show(n) {
    clearTimers();
    document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
    document.querySelectorAll('.pick-btn').forEach(function(b, i){ b.classList.toggle('active', i === n-1); });
    current = n;
    var screen = document.getElementById('o' + n);
    screen.classList.add('active');
    resetAll();
    t(function(){ runOption(n); }, 100);
  }

  function resetAll() {
    // Option 1
    document.querySelectorAll('.node,.edge').forEach(function(el){ el.classList.remove('on'); });
    document.getElementById('o1label').classList.remove('on');
    document.getElementById('o1sub').classList.remove('on');
    // Option 2
    document.getElementById('o2typed').textContent = '';
    document.getElementById('o2bar').style.width = '0';
    document.getElementById('o2icon').textContent = '';
    // Option 3
    document.getElementById('o3').classList.remove('phase2');
    document.getElementById('o3tag').classList.remove('on');
    document.getElementById('o3mono').style.opacity = '';
    document.getElementById('o3mono').style.transform = '';
    document.getElementById('o3full').style.opacity = '';
    document.getElementById('o3full').style.transform = '';
    // Option 4
    document.querySelectorAll('#o4 .metric').forEach(function(m){ m.classList.remove('on'); });
    document.getElementById('o4name').classList.remove('on');
    // Option 5
    ['t1','t2','t3','t4'].forEach(function(id){ document.getElementById(id).innerHTML = ''; });
    document.getElementById('t5ready').style.opacity = '0';
    document.getElementById('t5ready').innerHTML = '';
  }

  function runOption(n) {
    if (n === 1) runWorkflow();
    if (n === 2) runTypewriter();
    if (n === 3) runCinematic();
    if (n === 4) runMetrics();
    if (n === 5) runTerminal();
  }

  // ── OPTION 1 ──
  function runWorkflow() {
    var seq = [
      function(){ document.getElementById('n1').classList.add('on'); },
      function(){ document.getElementById('e1').classList.add('on'); document.getElementById('e2').classList.add('on'); },
      function(){ document.getElementById('n2').classList.add('on'); document.getElementById('n3').classList.add('on'); },
      function(){ document.getElementById('e3').classList.add('on'); document.getElementById('e4').classList.add('on'); document.getElementById('e5').classList.add('on'); document.getElementById('e6').classList.add('on'); },
      function(){ document.getElementById('n4').classList.add('on'); document.getElementById('n5').classList.add('on'); document.getElementById('n6').classList.add('on'); },
      function(){ document.getElementById('e7').classList.add('on'); document.getElementById('e8').classList.add('on'); document.getElementById('e9').classList.add('on'); },
      function(){ document.getElementById('n7').classList.add('on'); },
      function(){ document.getElementById('o1label').classList.add('on'); document.getElementById('o1sub').classList.add('on'); }
    ];
    seq.forEach(function(fn, i){ t(fn, 200 + i * 320); });
    t(function(){ resetAll(); t(function(){ runWorkflow(); }, 200); }, 200 + seq.length * 320 + 1800);
  }

  // ── OPTION 2 ──
  function runTypewriter() {
    var stages = [
      { icon: '📋', text: 'Scoping...', pct: 20 },
      { icon: '⚙️', text: 'Building...', pct: 45 },
      { icon: '🔍', text: 'Validating...', pct: 70 },
      { icon: '✅', text: 'Launching...', pct: 90 },
      { icon: '🚀', text: 'Ready.', pct: 100 }
    ];
    var si = 0;
    function nextStage() {
      if (si >= stages.length) {
        t(function(){ resetAll(); t(function(){ runTypewriter(); }, 200); }, 1200);
        return;
      }
      var s = stages[si++];
      document.getElementById('o2icon').textContent = s.icon;
      document.getElementById('o2bar').style.width = s.pct + '%';
      typeText('o2typed', s.text, 60, function(){
        t(nextStage, si < stages.length ? 500 : 1000);
      });
    }
    nextStage();
  }

  function typeText(id, text, speed, cb) {
    var el = document.getElementById(id);
    el.textContent = '';
    var i = 0;
    function tick() {
      el.textContent = text.slice(0, ++i);
      if (i < text.length) t(tick, speed);
      else if (cb) t(cb, 200);
    }
    tick();
  }

  // ── OPTION 3 ──
  function runCinematic() {
    t(function(){
      document.getElementById('o3').classList.add('phase2');
      t(function(){
        document.getElementById('o3tag').classList.add('on');
        t(function(){
          resetAll();
          t(function(){ runCinematic(); }, 200);
        }, 2200);
      }, 400);
    }, 1000);
  }

  // ── OPTION 4 ──
  function runMetrics() {
    ['m1','m2','m3','m4'].forEach(function(id, i){
      t(function(){ document.getElementById(id).classList.add('on'); }, i * 220);
    });
    t(function(){
      document.querySelectorAll('#o4 .metric').forEach(function(m){ m.classList.remove('on'); m.style.transition = 'all 0.5s'; m.style.opacity='0'; m.style.transform='scale(0.5)'; });
      document.getElementById('o4name').classList.add('on');
      t(function(){
        resetAll();
        t(function(){ runMetrics(); }, 200);
      }, 1800);
    }, 220 * 4 + 1200);
  }

  // ── OPTION 5 ──
  function runTerminal() {
    var lines = [
      { id: 't1', text: 'Loading Akash Panwar...', delay: 0 },
      { id: 't2', text: 'Skills: <span class="ok">✓ Verified</span>', delay: 700 },
      { id: 't3', text: 'Experience: <span class="ok">✓ 5+ Years</span>', delay: 1300 },
      { id: 't4', text: 'Portfolio: <span class="ok">✓ Ready</span>', delay: 1900 },
    ];
    lines.forEach(function(l){
      t(function(){
        var el = document.getElementById(l.id);
        if (l.text.indexOf('<') > -1) { el.innerHTML = l.text; return; }
        var i = 0;
        function tk() {
          el.textContent = l.text.slice(0, ++i);
          if (i < l.text.length) t(tk, 40);
        }
        tk();
      }, l.delay);
    });
    t(function(){
      var r = document.getElementById('t5ready');
      r.innerHTML = '<span class="name">$ Welcome ✦</span>';
      r.style.opacity = '1';
      t(function(){
        resetAll();
        t(function(){ runTerminal(); }, 200);
      }, 1800);
    }, 2500);
  }

  // Start with option 1
  t(function(){ runOption(1); }, 200);
</script>
</body>
</html>
